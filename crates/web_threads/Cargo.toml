[package]
name = "web_threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Threads for the browser build: Web Workers sharing the engine's memory, and the load pool type every build uses."

[dependencies]
bevy.workspace = true
diag.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
async-executor = "1.14"
async-task = "4.7"
futures-lite = "2.6"
concurrent-queue = "2.5"
web-time.workspace = true

[lints]
workspace = true

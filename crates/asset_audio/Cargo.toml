[package]
name = "asset_audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Authored sound aliases, curves, codecs, and map sound facts."

[dependencies]
vfs.workspace = true
web-time.workspace = true
asset_core.workspace = true
asset_transport.workspace = true
asset_iw4.workspace = true
fastfile_iw4.workspace = true
fastfile_iw5.workspace = true
fastfile_t5.workspace = true
fastfile_t6.workspace = true
diag.workspace = true
bevy.workspace = true
blake3 = "=1.8.5"
serde.workspace = true
postcard = { version = "1", default-features = false, features = ["use-std"] }

# The pack is written natively by the `sound_pack` bin; the browser only reads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flacenc = "0.5.1"
# The baker decodes every stream it writes the way the game will, and keeps
# plain PCM for any the game's decoder would refuse.
symphonia = { version = "0.5", default-features = false, features = ["flac"] }

[lints]
workspace = true
